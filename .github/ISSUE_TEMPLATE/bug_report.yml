name: Bug report
description: Report reproducible behavior in Desktop Vitals
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post security vulnerabilities here. Follow SECURITY.md. Review and redact probe output before sharing it.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux distribution and desktop/session
      description: Include X11 or Wayland, Python version, GTK version, and GPU/driver when relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed logs, screenshots, and probe output for personal data.
          required: true
